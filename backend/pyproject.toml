[project]
name = "laqta-backend"
version = "0.4.0"
description = "Laqta backend — local-first API for the long-video-to-Shorts studio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "thewizard2030" }]
keywords = ["fastapi", "video", "shorts", "local-first", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The manifest pipeline lives in the `laqta` core package at the repository
# root. Laqta is distributed as source, so the dependency is a local path:
#     pip install -e ..            # from backend/
#     pip install -e .             # from the repository root
pipeline = ["laqta"]
# Local CPU speech recognition (faster-whisper + CTranslate2, MIT).
asr = ["faster-whisper>=1.1"]
# Optional analysis stages (shot detection and audio features).
analysis = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "scenedetect[opencv]>=0.6",
    # Deliberate upper bound, and a direct conflict guard. OpenCV 5.x stopped
    # bundling the Haar cascade that qatta/stages/s06_reframe_subs/detector.py
    # loads, so a 5.x wheel installs fine and then silently finds no faces.
    # Rationale and measurements: backend/requirements-analysis.txt.
    #
    # mediapipe is intentionally absent (it was already meant to be gone after
    # v0.3.0): it pulls opencv-contrib-python, a *different* distribution that
    # installs the same `cv2` package. Two of them in one environment means one
    # silently overwrites the other, so the detector could load a build with no
    # cascades regardless of this pin.
    "opencv-python<5",
]
# URL ingestion / YouTube captions-first flow (Unlicense).
url = ["yt-dlp>=2024.04"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.5.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/thewizard2030/laqta"
Repository = "https://github.com/thewizard2030/laqta"
Issues = "https://github.com/thewizard2030/laqta/issues"
Changelog = "https://github.com/thewizard2030/laqta/blob/main/CHANGELOG.md"

# The backend is a flat layout (`app/`, `tests/`, `tools/`) — auto-discovery
# would refuse to guess, so the package set is declared explicitly.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
