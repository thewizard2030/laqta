<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A11" />
      <stop offset="50%" stop-color="#0c111d" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="55%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D121F" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="120" r="220" fill="#7c4dff" opacity="0.12" filter="url(#glowViolet)" />
  <circle cx="1080" cy="480" r="240" fill="#22d3ee" opacity="0.1" filter="url(#glowCyan)" />
  <circle cx="680" cy="320" r="180" fill="#8b5cf6" opacity="0.08" filter="url(#glowViolet)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280" stroke="#7c4dff" stroke-width="1" stroke-dasharray="2 6" />
    <path d="M80 0 V640 M160 0 V640 M240 0 V640 M320 0 V640 M400 0 V640 M480 0 V640 M560 0 V640 M640 0 V640 M720 0 V640 M800 0 V640 M880 0 V640 M960 0 V640 M1040 0 V640 M1120 0 V640 M1200 0 V640" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 6" />
  </g>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  <g transform="translate(80, 75)">
    <!-- Brand Logo & Arabic Wordmark -->
    <g transform="translate(0, 0)">
      <!-- Laqta Icon Mark -->
      <rect width="56" height="56" rx="16" fill="url(#brandGrad)" />
      <path d="M56 14 L42 14 L56 30 Z" fill="#070A11" fill-opacity="0.32" />
      <path d="M16 13 H25 V31 H41 V41 H16 Z" fill="#FFFFFF" />
      <path d="M29 15 L38 20 L29 25 Z" fill="#FFFFFF" fill-opacity="0.95" />

      <!-- Latin Wordmark -->
      <text x="74" y="42" class="font-sans" font-size="44" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Laqta</text>

      <!-- Arabic Wordmark Badge -->
      <rect x="200" y="8" width="80" height="40" rx="10" fill="#7c4dff" fill-opacity="0.2" stroke="#7c4dff" stroke-opacity="0.4" stroke-width="1" />
      <text x="240" y="35" class="font-sans" font-size="22" font-weight="800" text-anchor="middle" fill="#ddd6fe">لقطّة</text>

      <!-- Open Source Pill -->
      <rect x="292" y="8" width="112" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="308" cy="28" r="4" fill="#10b981" />
      <text x="350" y="33" class="font-mono" font-size="13" font-weight="700" text-anchor="middle" fill="#34d399">MIT Free</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="font-sans" font-size="42" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      Local-First Video-to-Shorts
    </text>
    <text x="0" y="178" class="font-sans" font-size="42" font-weight="900" letter-spacing="-0.5" fill="url(#brandGrad)">
      Open-Source Studio
    </text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="226" class="font-sans" font-size="19" font-weight="400" fill="#94a3b8" width="600">
      The free, 100% on-device alternative to Opus Clip &amp; Submagic.
    </text>
    <text x="0" y="254" class="font-sans" font-size="19" font-weight="400" fill="#94a3b8">
      Turn long podcasts into ranked vertical Shorts with native Arabic RTL captions.
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 295)">
      <!-- Badge 1: Local / Privacy -->
      <g transform="translate(0, 0)">
        <rect width="210" height="44" rx="12" fill="#0D121F" stroke="#7c4dff" stroke-opacity="0.35" stroke-width="1" />
        <circle cx="24" cy="22" r="6" fill="#10b981" />
        <text x="40" y="27" class="font-sans" font-size="13.5" font-weight="700" fill="#FFFFFF">100% On-Device</text>
        <text x="145" y="27" class="font-sans" font-size="12" font-weight="500" fill="#64748b">· 0 Telemetry</text>
      </g>

      <!-- Badge 2: Arabic RTL -->
      <g transform="translate(222, 0)">
        <rect width="200" height="44" rx="12" fill="#0D121F" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1" />
        <text x="20" y="28" class="font-sans" font-size="16" fill="#22d3ee">🌍</text>
        <text x="44" y="27" class="font-sans" font-size="13.5" font-weight="700" fill="#FFFFFF">Native Arabic RTL</text>
        <text x="162" y="27" class="font-sans" font-size="12" font-weight="500" fill="#64748b">BiDi</text>
      </g>
    </g>

    <g transform="translate(0, 350)">
      <!-- Badge 3: Explainable AI -->
      <g transform="translate(0, 0)">
        <rect width="230" height="44" rx="12" fill="#0D121F" stroke="#7c4dff" stroke-opacity="0.35" stroke-width="1" />
        <text x="18" y="28" class="font-sans" font-size="16" fill="#8b5cf6">🧠</text>
        <text x="44" y="27" class="font-sans" font-size="13.5" font-weight="700" fill="#FFFFFF">Explainable AI Scoring</text>
        <text x="195" y="27" class="font-sans" font-size="12" font-weight="500" fill="#64748b">CPS</text>
      </g>

      <!-- Badge 4: Modest Hardware -->
      <g transform="translate(242, 0)">
        <rect width="180" height="44" rx="12" fill="#0D121F" stroke="#7c4dff" stroke-opacity="0.35" stroke-width="1" />
        <text x="18" y="28" class="font-sans" font-size="16" fill="#f59e0b">🪶</text>
        <text x="44" y="27" class="font-sans" font-size="13.5" font-weight="700" fill="#FFFFFF">8 GB CPU Ready</text>
      </g>
    </g>

    <!-- Quickstart Command Snippet -->
    <g transform="translate(0, 420)">
      <rect width="470" height="52" rx="14" fill="#070A11" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="24" cy="26" r="4.5" fill="#ef4444" opacity="0.8" />
      <circle cx="38" cy="26" r="4.5" fill="#f59e0b" opacity="0.8" />
      <circle cx="52" cy="26" r="4.5" fill="#10b981" opacity="0.8" />
      <text x="76" y="32" class="font-mono" font-size="14.5" fill="#22d3ee" font-weight="600">$</text>
      <text x="94" y="32" class="font-mono" font-size="14.5" fill="#e2e8f0" font-weight="500">git clone ... &amp;&amp; laqta studio --production</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 9:16 PHONE MOCKUP ================= -->
  <g transform="translate(860, 45)" filter="url(#dropShadow)">
    <!-- Phone Exterior (Bezel) -->
    <rect width="320" height="550" rx="42" fill="#070A11" stroke="url(#phoneBorder)" stroke-width="3" />

    <!-- Speaker / Camera Notch -->
    <rect x="120" y="14" width="80" height="18" rx="9" fill="#030712" />
    <circle cx="178" cy="23" r="4" fill="#1e293b" />

    <!-- Phone Screen Canvas (9:16) -->
    <g transform="translate(14, 38)">
      <clipPath id="screenClip">
        <rect width="292" height="494" rx="30" />
      </clipPath>

      <g clip-path="url(#screenClip)">
        <!-- Video Backdrop Gradient -->
        <rect width="292" height="494" fill="#0F172A" />

        <!-- Speaker Silhouette / Visual Anchor -->
        <circle cx="146" cy="180" r="70" fill="#1E293B" />
        <ellipse cx="146" cy="300" rx="100" ry="60" fill="#1E293B" />

        <!-- Active Speaker Facial Box / Tracker -->
        <rect x="96" y="125" width="100" height="110" rx="14" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
        <circle cx="146" cy="125" r="3.5" fill="#22d3ee" />

        <!-- Top Status / Hook Tag -->
        <g transform="translate(16, 20)">
          <rect width="115" height="28" rx="8" fill="#7c4dff" fill-opacity="0.9" />
          <text x="12" y="19" class="font-sans" font-size="12" font-weight="800" fill="#FFFFFF">CPS 96 / 100</text>
          <circle cx="98" cy="14" r="3" fill="#10b981" />
        </g>

        <!-- Waveform Visualizer -->
        <g transform="translate(16, 320)" opacity="0.85">
          <rect x="0" y="14" width="4" height="16" rx="2" fill="#22d3ee" />
          <rect x="8" y="8" width="4" height="28" rx="2" fill="#7c4dff" />
          <rect x="16" y="18" width="4" height="8" rx="2" fill="#22d3ee" />
          <rect x="24" y="4" width="4" height="36" rx="2" fill="#7c4dff" />
          <rect x="32" y="10" width="4" height="24" rx="2" fill="#22d3ee" />
          <rect x="40" y="2" width="4" height="40" rx="2" fill="#8b5cf6" />
          <rect x="48" y="12" width="4" height="20" rx="2" fill="#22d3ee" />
          <rect x="56" y="6" width="4" height="32" rx="2" fill="#7c4dff" />
          <rect x="64" y="15" width="4" height="14" rx="2" fill="#22d3ee" />
          <rect x="72" y="3" width="4" height="38" rx="2" fill="#8b5cf6" />
          <rect x="80" y="11" width="4" height="22" rx="2" fill="#22d3ee" />
          <rect x="88" y="8" width="4" height="28" rx="2" fill="#7c4dff" />
          <rect x="96" y="17" width="4" height="10" rx="2" fill="#22d3ee" />
          <rect x="104" y="5" width="4" height="34" rx="2" fill="#8b5cf6" />
          <rect x="112" y="12" width="4" height="20" rx="2" fill="#22d3ee" />
          <rect x="120" y="2" width="4" height="40" rx="2" fill="#7c4dff" />
          <rect x="128" y="10" width="4" height="24" rx="2" fill="#22d3ee" />
          <rect x="136" y="6" width="4" height="32" rx="2" fill="#8b5cf6" />
          <rect x="144" y="14" width="4" height="16" rx="2" fill="#22d3ee" />
          <rect x="152" y="4" width="4" height="36" rx="2" fill="#7c4dff" />
          <rect x="160" y="9" width="4" height="26" rx="2" fill="#22d3ee" />
          <rect x="168" y="3" width="4" height="38" rx="2" fill="#8b5cf6" />
          <rect x="176" y="13" width="4" height="18" rx="2" fill="#22d3ee" />
          <rect x="184" y="7" width="4" height="30" rx="2" fill="#7c4dff" />
          <rect x="192" y="16" width="4" height="12" rx="2" fill="#22d3ee" />
          <rect x="200" y="5" width="4" height="34" rx="2" fill="#8b5cf6" />
          <rect x="208" y="11" width="4" height="22" rx="2" fill="#22d3ee" />
          <rect x="216" y="2" width="4" height="40" rx="2" fill="#7c4dff" />
          <rect x="224" y="14" width="4" height="16" rx="2" fill="#22d3ee" />
          <rect x="232" y="8" width="4" height="28" rx="2" fill="#8b5cf6" />
          <rect x="240" y="15" width="4" height="14" rx="2" fill="#22d3ee" />
          <rect x="248" y="6" width="4" height="32" rx="2" fill="#7c4dff" />
          <rect x="256" y="18" width="4" height="8" rx="2" fill="#22d3ee" />
        </g>

        <!-- Subtitle Box — Styled Burned-in Arabic RTL Subtitle -->
        <g transform="translate(18, 380)">
          <!-- Subtitle Background Plate -->
          <rect width="256" height="74" rx="14" fill="#070A11" fill-opacity="0.88" stroke="#7c4dff" stroke-opacity="0.4" stroke-width="1.5" />

          <!-- Active Word Karaoke Neon Highlight -->
          <rect x="142" y="14" width="98" height="26" rx="6" fill="#7c4dff" />

          <!-- Burned-in Arabic Text with English Term -->
          <text x="128" y="33" class="font-sans" font-size="16" font-weight="900" text-anchor="middle" fill="#FFFFFF">
            الذكاء الاصطناعي <tspan fill="#22d3ee">Local</tspan>
          </text>
          <text x="128" y="58" class="font-sans" font-size="14.5" font-weight="700" text-anchor="middle" fill="#ddd6fe">
            بدون أي اشتراك أو رفع سحابي
          </text>
        </g>

        <!-- Bottom Home Indicator -->
        <rect x="96" y="480" width="100" height="4" rx="2" fill="#64748b" opacity="0.6" />
      </g>
    </g>
  </g>
</svg>
