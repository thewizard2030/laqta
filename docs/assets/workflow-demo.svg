<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" width="1060" height="250">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="55%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C30" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1060" height="250" rx="16" fill="#070A11" stroke="#1E293B" stroke-width="1.5" />

  <!-- Connecting Flow Arrows -->
  <g stroke="#7c4dff" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <path d="M 235 125 L 275 125" />
    <path d="M 495 125 L 535 125" />
    <path d="M 755 125 L 795 125" />
  </g>
  <polygon points="275,121 283,125 275,129" fill="#22d3ee" />
  <polygon points="535,121 543,125 535,129" fill="#22d3ee" />
  <polygon points="795,121 803,125 795,129" fill="#22d3ee" />

  <!-- STEP 1: INGEST -->
  <g transform="translate(25, 25)" filter="url(#cardShadow)">
    <rect width="210" height="200" rx="14" fill="url(#cardBg)" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="34" cy="34" r="14" fill="#7c4dff" fill-opacity="0.2" />
    <text x="34" y="39" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#ddd6fe">01</text>
    <text x="58" y="38" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Local Ingest</text>
    
    <rect x="20" y="62" width="170" height="1" fill="#1E293B" />
    
    <text x="20" y="85" class="sans" font-size="13" font-weight="600" fill="#94a3b8">📁 MP4 / MKV / MOV</text>
    <text x="20" y="110" class="sans" font-size="12" fill="#64748b">16 kHz mono extraction</text>
    <text x="20" y="132" class="sans" font-size="12" fill="#64748b">FFprobe media metadata</text>

    <!-- Pill -->
    <rect x="20" y="152" width="135" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="87" y="169" class="mono" font-size="10.5" font-weight="700" text-anchor="middle" fill="#34d399">100% On-Device</text>
  </g>

  <!-- STEP 2: TRANSCRIBE -->
  <g transform="translate(285, 25)" filter="url(#cardShadow)">
    <rect width="210" height="200" rx="14" fill="url(#cardBg)" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="34" cy="34" r="14" fill="#7c4dff" fill-opacity="0.2" />
    <text x="34" y="39" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#ddd6fe">02</text>
    <text x="58" y="38" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Two-Pass ASR</text>

    <rect x="20" y="62" width="170" height="1" fill="#1E293B" />

    <text x="20" y="85" class="sans" font-size="13" font-weight="600" fill="#94a3b8">🎙️ faster-whisper (CPU)</text>
    <text x="20" y="110" class="sans" font-size="12" fill="#64748b">VAD atomic bounds (U_001)</text>
    <text x="20" y="132" class="sans" font-size="12" fill="#64748b">Arablish prompt support</text>

    <!-- Pill -->
    <rect x="20" y="152" width="125" height="26" rx="6" fill="#7c4dff" fill-opacity="0.18" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="1" />
    <text x="82" y="169" class="mono" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ddd6fe">8 GB RAM Ready</text>
  </g>

  <!-- STEP 3: EXPLAINABLE RANK -->
  <g transform="translate(545, 25)" filter="url(#cardShadow)">
    <rect width="210" height="200" rx="14" fill="url(#cardBg)" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="34" cy="34" r="14" fill="#22d3ee" fill-opacity="0.2" />
    <text x="34" y="39" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#22d3ee">03</text>
    <text x="58" y="38" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Explainable CPS</text>

    <rect x="20" y="62" width="170" height="1" fill="#1E293B" />

    <text x="20" y="85" class="sans" font-size="13" font-weight="600" fill="#94a3b8">🧠 Score 0–100 + Why</text>
    <text x="20" y="110" class="sans" font-size="12" fill="#64748b">Topic &amp; speech dynamics</text>
    <text x="20" y="132" class="sans" font-size="12" fill="#64748b">Zero black-box fake %</text>

    <!-- Pill -->
    <rect x="20" y="152" width="130" height="26" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" />
    <text x="85" y="169" class="mono" font-size="10.5" font-weight="700" text-anchor="middle" fill="#22d3ee">Measured, Not Asserted</text>
  </g>

  <!-- STEP 4: RENDER & CAPTIONS -->
  <g transform="translate(805, 25)" filter="url(#cardShadow)">
    <rect width="230" height="200" rx="14" fill="url(#cardBg)" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="34" cy="34" r="14" fill="#7c4dff" fill-opacity="0.2" />
    <text x="34" y="39" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#ddd6fe">04</text>
    <text x="58" y="38" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">Render 9:16 Shorts</text>

    <rect x="20" y="62" width="190" height="1" fill="#1E293B" />

    <text x="20" y="85" class="sans" font-size="13" font-weight="600" fill="#94a3b8">🎬 1080×1920 MP4</text>
    <text x="20" y="110" class="sans" font-size="12" fill="#64748b">Arabic RTL / BiDi isolates</text>
    <text x="20" y="132" class="sans" font-size="12" fill="#64748b">Pass-2 precision word timing</text>

    <!-- Pill -->
    <rect x="20" y="152" width="140" height="26" rx="6" fill="#7c4dff" fill-opacity="0.18" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="1" />
    <text x="90" y="169" class="mono" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ddd6fe">Native Arabic Subtitles</text>
  </g>
</svg>
