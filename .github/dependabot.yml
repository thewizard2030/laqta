version: 2

updates:
  # Python dependencies of the backend and the core package.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The frontend toolchain.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
