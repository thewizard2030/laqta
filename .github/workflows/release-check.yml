name: Release check

# Proves that the repository actually works: a clean clone, a real install
# and the whole pipeline (import → transcribe → rank → render) with a
# synthetic video. It is the check that catches packaging and release-mode
# regressions before a user does.
on:
  schedule:
    # Sundays at 05:00 UTC.
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "qatta/**"
      - "scripts/**"
      - ".github/workflows/release-check.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Clean-room round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev espeak-ng

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install the core package
        run: pip install -e .

      - name: Cache the speech model
        uses: actions/cache@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ~/.cache/huggingface
          key: laqta-whisper-base-${{ hashFiles('backend/requirements-asr.txt') }}
          restore-keys: laqta-whisper-base-

      - name: Verify the release end to end
        run: python scripts/verify_release.py --source . --skip-install

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification
          path: |
            /tmp/laqta-verify-*/
          retention-days: 3
          if-no-files-found: ignore
