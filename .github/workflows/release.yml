name: Release (Legacy Manual Fallback)

# DEPRECATED as an automatic release publisher: superseded by CircleCI
# (.circleci/config.yml `release` workflow on `vMAJOR.MINOR.PATCH` tags).
# Automatic `push: tags` triggering is intentionally disabled to avoid competing
# releases. Currently DORMANT while the repository GitHub Actions account is
# under a billing lock — do not claim dormant workflows are passing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to publish (e.g. v0.2.5)"
        required: true
        type: string
      confirm_manual_fallback:
        description: "Confirm CircleCI release publishing failed/did not run for this tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Manual release fallback
    if: github.event.inputs.confirm_manual_fallback == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist in this repository."
            exit 1
          fi
          git checkout "$TAG"

      - name: Check manifests and changelog notes
        run: |
          python3 scripts/check_version.py
          python3 scripts/release_notes.py "${{ steps.tag.outputs.value }}" --check
          mkdir -p dist
          python3 scripts/release_notes.py "${{ steps.tag.outputs.value }}" > dist/release-notes.md

      - name: Build immutable source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="laqta-${{ steps.tag.outputs.value }}/" \
            -o "dist/laqta-${{ steps.tag.outputs.value }}.tar.gz" "${{ steps.tag.outputs.value }}"

      - name: Publish GitHub Release idempotently
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_github_release.py \
            --tag "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --archive "dist/laqta-${{ steps.tag.outputs.value }}.tar.gz" \
            --notes-file "dist/release-notes.md" \
            --verify-git-tag
