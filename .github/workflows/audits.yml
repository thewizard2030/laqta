name: Scheduled audits

# Weekly supply-chain check for the whole repository. It reports problems but
# does not block a release — the blocking checks live in the CI workflow.
on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit the runtime profile
        run: pip-audit --requirement backend/requirements-asr.txt --progress-spinner off
      - name: Audit the pinned lock
        run: |
          pip install --require-hashes -r backend/requirements-lock.txt
          pip-audit --local --progress-spinner off

  node-audit:
    name: Node vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit the shipped dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit the development dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true
