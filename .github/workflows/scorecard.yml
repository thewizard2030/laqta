name: Scorecard (Manual Dispatch Only)

# Preserved GitHub-native OpenSSF Scorecard security posture analysis (not
# covered by CircleCI). Automatic `branch_protection_rule`, `schedule`, and
# `push` triggers disabled while GitHub Actions is billing-locked; can be
# restored once GitHub Actions billing is active.
on:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5
