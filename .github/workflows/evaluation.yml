name: Evaluation

# Measures the clip ranking against the labelled benchmark and fails when a
# metric regresses. The numbers are published in docs/EVALUATION.md.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "qatta/stages/s05_ranking/**"
      - "qatta/stages/s04_candidates/**"
      - "benchmarks/**"
      - "scripts/evaluate_ranking.py"

permissions:
  contents: read

jobs:
  evaluate:
    name: Clip-selection benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev espeak-ng

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install the core package
        run: pip install -e .

      - name: Cache the speech model
        uses: actions/cache@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ~/.cache/huggingface
          key: laqta-benchmark-whisper-${{ hashFiles('backend/requirements-asr.txt') }}
          restore-keys: laqta-benchmark-whisper-

      - name: Run the benchmark
        run: |
          python scripts/evaluate_ranking.py --check \
            | tee benchmark-report.txt
          {
            echo "## Clip-selection benchmark"
            echo
            echo '```'
            cat benchmark-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: benchmark-report.txt
          retention-days: 14
