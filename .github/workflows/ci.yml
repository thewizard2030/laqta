name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: the workflows only need to read the repository.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------
  # Backend: the API, the core pipeline and the quality gates.
  # ---------------------------------------------------------------------
  backend:
    name: Backend (py${{ matrix.python_version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install the core package (editable)
        run: pip install -e .

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check qatta backend/app backend/tests tests scripts
          ruff format --check qatta backend/app backend/tests tests scripts

      - name: Verify the version is consistent across the manifests
        run: python scripts/check_version.py

      # Both suites write into ONE coverage session: the core suite exercises
      # the `qatta` package, the backend suite the `app` package. Measuring them
      # separately understates the core package badly (78% vs 60% combined).
      - name: Test — backend API (with coverage)
        working-directory: backend
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: pytest -n auto --cov=app --cov=../qatta --cov-report=

      - name: Test — core pipeline (with coverage)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: pytest tests --cov=qatta --cov-append --cov-report=

      - name: Coverage report
        run: |
          python -m coverage json --data-file .coverage -o coverage-backend.json
          python scripts/check_coverage.py --backend coverage-backend.json

      - name: Coverage — no regression
        run: python scripts/check_coverage.py --backend coverage-backend.json

  # ---------------------------------------------------------------------
  # Frontend: typecheck, lint, format, unit tests and a production build.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vitest 5 requires Node >= 22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Check formatting (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests (vitest, with coverage)
        working-directory: frontend
        run: npm run test -- --coverage.enabled --coverage.provider=v8 --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reportsDirectory=../coverage-frontend

      - name: Coverage — no regression
        working-directory: frontend
        run: python ../scripts/check_coverage.py --frontend ../coverage-frontend/coverage-summary.json

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # Supply chain: no vulnerable or untrusted dependency may enter.
  # ---------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit the Python runtime profile
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement backend/requirements-asr.txt --progress-spinner off

      - name: Audit the shipped Node dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------
  # Dependency review: only approve dependency changes that are sane.
  # ---------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
